<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host Fire - Duo Fighting Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Roboto', sans-serif;
      background: #1a202c;
      color: #f7fafc;
      overflow: hidden;
    }
    #gameCanvas {
      background: #2d3748;
      display: block;
      margin: 0 auto;
      border: 2px solid #4a5568;
      border-radius: 8px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-full p-4">
  <h1 class="text-4xl font-bold mb-4">Host Fire - Duo Fighting Game</h1>
  <canvas id="gameCanvas" width="800" height="450" class="shadow-lg"></canvas>
  <div class="mt-4 w-full max-w-4xl grid grid-cols-2 gap-4">
    <div class="bg-gray-700 p-4 rounded-lg">
      <h2 class="text-xl font-semibold mb-2">Player 1 (WASD + Space)</h2>
      <p>Health: <span id="p1Health">100</span></p>
      <p>Score: <span id="p1Score">0</span></p>
    </div>
    <div class="bg-gray-700 p-4 rounded-lg">
      <h2 class="text-xl font-semibold mb-2">Player 2 (Arrow Keys + Enter)</h2>
      <p>Health: <span id="p2Health">100</span></p>
      <p>Score: <span id="p2Score">0</span></p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
